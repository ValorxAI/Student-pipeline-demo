name: Deploy Valorx MS - Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:
permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: valorxacrdev
  IMAGE_NAME: valorx-ms
  RESOURCE_GROUP: rg-valorx-dev
  CONTAINER_APP_NAME1: api-template-gateway-dev
  CONTAINER_APP_NAME2: dataservice-dev
  CONTAINER_APP_NAME3: master-dataservice-dev

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # 4. Build final Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      # 5. Push final image to ACR
      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Update Container App
      - name: API Template Gateway
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME1 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Data Service
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME2 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Master Data Service
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME3 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}