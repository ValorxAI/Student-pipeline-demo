name: Deploy Valorx MS - Dev and Staging

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Azure / ACR
  ACR_NAME: valorxacrdev
  ACR_LOGIN_SERVER: valorxacrdev.azurecr.io
  # Docker image
  IMAGE_NAME: valorx-ms

  # Resource groups
  DEV_RESOURCE_GROUP: rg-valorx-dev
  STAGING_RESOURCE_GROUP: rg-valorx-staging

  # Dev Container Apps
  DEV_CONTAINER_APP_1: api-template-gateway-dev
  DEV_CONTAINER_APP_2: dataservice-dev
  DEV_CONTAINER_APP_3: master-dataservice-dev

  # Staging Container Apps
  STAGING_CONTAINER_APP_1: api-template-gateway-staging
  STAGING_CONTAINER_APP_3: master-dataservice-staging

jobs:

  # ============================================================
  # 1. BUILD AND PUSH IMAGE
  # ============================================================

  build-and-push:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    environment: dev

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # --------------------------------------------------------
      # Create unique image tag
      # --------------------------------------------------------

      - name: Set Image Tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Image:"
          echo "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"

      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.image.outputs.image }} \
            .

      # --------------------------------------------------------
      # Push Docker Image to ACR
      # --------------------------------------------------------

      - name: Push Docker Image
        run: |
          docker push ${{ steps.image.outputs.image }}


  # ============================================================
  # 2. DEPLOY TO DEVELOPMENT
  # ============================================================

  deploy-dev:
    name: Deploy to Development

    needs: build-and-push

    runs-on: ubuntu-latest

    environment: dev

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Deploy API Template Gateway
      # --------------------------------------------------------

      - name: Deploy API Template Gateway - Dev
        run: |
          az containerapp update \
            --name ${{ env.DEV_CONTAINER_APP_1 }} \
            --resource-group ${{ env.DEV_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }}

      # --------------------------------------------------------
      # Deploy Data Service
      # --------------------------------------------------------

      - name: Deploy Data Service - Dev
        run: |
          az containerapp update \
            --name ${{ env.DEV_CONTAINER_APP_2 }} \
            --resource-group ${{ env.DEV_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }}

      # --------------------------------------------------------
      # Deploy Master Data Service
      # --------------------------------------------------------

      - name: Deploy Master Data Service - Dev
        run: |
          az containerapp update \
            --name ${{ env.DEV_CONTAINER_APP_3 }} \
            --resource-group ${{ env.DEV_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }}


  # ============================================================
  # 3. STAGING DEPLOYMENT
  #
  # GitHub Environment "staging" should have REQUIRED REVIEWERS
  # configured.
  # ============================================================

  deploy-staging:
    name: Deploy to Staging

    needs: deploy-dev

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      # --------------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Deploy API Template Gateway
      # --------------------------------------------------------

      - name: Deploy API Template Gateway - Staging
        run: |
          az containerapp update \
            --name ${{ env.STAGING_CONTAINER_APP_1 }} \
            --resource-group ${{ env.STAGING_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }}

      # --------------------------------------------------------
      # Deploy Master Data Service
      # --------------------------------------------------------

      - name: Deploy Master Data Service - Staging
        run: |
          az containerapp update \
            --name ${{ env.STAGING_CONTAINER_APP_3 }} \
            --resource-group ${{ env.STAGING_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image }}
