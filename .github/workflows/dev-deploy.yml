name: Deploy Valorx MS - Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: valorxacrdev
  IMAGE_NAME: valorx-ms
  RESOURCE_GROUP: rg-valorx-dev
  CONTAINER_APP_NAME1: api-template-gateway-dev
  CONTAINER_APP_NAME2: dataservice-dev
  CONTAINER_APP_NAME3: master-dataservice-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy API Template Gateway
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME1 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Data Service
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME2 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Master Data Service
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME3 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployed images
        run: |
          echo "API Template Gateway:"
          az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME1 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" \
            --output tsv

          echo "Data Service:"
          az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME2 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" \
            --output tsv

          echo "Master Data Service:"
          az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME3 }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" \
            --output tsv