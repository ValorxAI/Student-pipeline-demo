name: Deploy Valorx MS - Dev and Staging

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: valorxacrdev
  ACR_LOGIN_SERVER: valorxacrdev.azurecr.io
  IMAGE_NAME: valorx-ms

  DEV_RESOURCE_GROUP: rg-valorx-dev
  STAGING_RESOURCE_GROUP: rg-valorx-staging

  DEV_CONTAINER_APP_1: api-template-gateway-dev
  DEV_CONTAINER_APP_2: dataservice-dev
  DEV_CONTAINER_APP_3: master-dataservice-dev

  STAGING_CONTAINER_APP_1: api-template-gateway-staging
  STAGING_CONTAINER_APP_2: dataservice-staging
  STAGING_CONTAINER_APP_3: master-dataservice-staging

jobs:

  # ==========================================================
  # 1. Build and Push ONE Docker Image
  # ==========================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name "${{ env.ACR_NAME }}"

      - name: Set Image Tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Docker Image:"
          echo "${IMAGE}"
          echo "======================================"

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}" \
            .

      - name: Push Docker Image
        run: |
          docker push "${{ steps.image.outputs.image }}"


  # ==========================================================
  # 2. Deploy SAME Image to Development
  # ==========================================================
  deploy-dev:
    name: Deploy to Development
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display Image
        run: |
          echo "======================================"
          echo "Deploying image to Development:"
          echo "${{ needs.build-and-push.outputs.image }}"
          echo "======================================"

      - name: Deploy API Template Gateway - Dev
        run: |
          az containerapp update \
            --name "${{ env.DEV_CONTAINER_APP_1 }}" \
            --resource-group "${{ env.DEV_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Deploy Data Service - Dev
        run: |
          az containerapp update \
            --name "${{ env.DEV_CONTAINER_APP_2 }}" \
            --resource-group "${{ env.DEV_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Deploy Master Data Service - Dev
        run: |
          az containerapp update \
            --name "${{ env.DEV_CONTAINER_APP_3 }}" \
            --resource-group "${{ env.DEV_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"


  # ==========================================================
  # 3. Approval + Deploy SAME Image to Staging
  # ==========================================================
  deploy-staging:
    name: Deploy to Staging

    needs:
      - build-and-push
      - deploy-dev

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display Image
        run: |
          echo "======================================"
          echo "Deploying SAME image to Staging:"
          echo "${{ needs.build-and-push.outputs.image }}"
          echo "======================================"

      - name: Deploy API Template Gateway - Staging
        run: |
          az containerapp update \
            --name "${{ env.STAGING_CONTAINER_APP_1 }}" \
            --resource-group "${{ env.STAGING_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Deploy Data Service - Staging
        run: |
          az containerapp update \
            --name "${{ env.STAGING_CONTAINER_APP_2 }}" \
            --resource-group "${{ env.STAGING_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Deploy Master Data Service - Staging
        run: |
          az containerapp update \
            --name "${{ env.STAGING_CONTAINER_APP_3 }}" \
            --resource-group "${{ env.STAGING_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"